---
version: "3"

vars:
  FLAKE_DIR: "{{.TASKFILE_DIR}}/../.."

tasks:
  rebuild-local:
    desc: "Rebuild the current machine from the local clone"
    cmds:
      - sudo nixos-rebuild switch --flake "{{.FLAKE_DIR}}#$(hostname)"

  rebuild-remote:
    desc: "Rebuild the current machine from the GitHub repository"
    cmds:
      - sudo nixos-rebuild switch --flake "github:ol3d/nixos-config#$(hostname)"

  update:
    desc: "Update all pinned flake inputs"
    cmds:
      - nix flake update "{{.FLAKE_DIR}}"
      - echo "review the flake.lock diff, then commit and push"

  check:
    desc: "Evaluate the flake as a pre-push smoke test"
    cmds:
      - nix flake check "{{.FLAKE_DIR}}"
